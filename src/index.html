<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>DynamicEnroll - Plateforme d'Inscription en Ligne</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plateforme moderne de gestion des inscriptions académiques avec processus automatisé et sécurisé">
  <meta name="keywords" content="inscription, éducation, université, candidature, enrollment">
  <meta name="author" content="DynamicEnroll">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dynamicenroll.com/">
  <meta property="og:title" content="DynamicEnroll - Plateforme d'Inscription">
  <meta property="og:description" content="Simplifiez vos inscriptions académiques">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect to API -->
  <link rel="preconnect" href="http://localhost:8080">
  
  <!-- Google Fonts (Optional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Loading spinner */
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #e0e5ec 0%, #f5f7fa 100%);
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e5ec;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: #64748b;
      font-weight: 500;
    }
    
    /* Hide loading when app is ready */
    app-root:not(:empty) + .app-loading {
      display: none;
    }
  </style>
</head>
<body class="bg-neo-light">
  <app-root></app-root>
  
  <!-- Loading indicator -->
  <div class="app-loading">
  <div class="spinner"></div>
  <div class="loading-text">Chargement de DynamicEnroll...</div>
  </div>
</body>
</html>
